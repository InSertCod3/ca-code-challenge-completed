services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wp}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.9-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /var/www/html/wp-content/themes /var/www/html/wp-content/languages
        cp -rn /usr/src/wordpress/wp-content/themes/. /var/www/html/wp-content/themes/ 2>/dev/null || true
        cp -rn /usr/src/wordpress/wp-content/languages/. /var/www/html/wp-content/languages/ 2>/dev/null || true
        [ -f /var/www/html/wp-content/index.php ] || cp /usr/src/wordpress/wp-content/index.php /var/www/html/wp-content/index.php 2>/dev/null || true
        exec docker-entrypoint.sh apache2-foreground

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Brand Reviews Challenge}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts:ro
    entrypoint: ["wp", "--allow-root"]

  content_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${CONTENT_DB_PASSWORD:-local-content-password}
    volumes:
      - content_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identities
      POSTGRES_USER: identities
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-password}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identities -d identities"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      auth_db:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-django-secret}
      AUTH_ALLOWED_HOSTS: localhost,127.0.0.1,auth
      DB_HOST: auth_db
      DB_NAME: identities
      DB_USER: identities
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-password}
      WP_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      AUTH_INTROSPECT_KEY: ${AUTH_INTROSPECT_KEY:-local-service-key-at-least-32-characters-long}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    command: >-
      sh -c 'python manage.py migrate --noinput &&
             python manage.py migrate_wp_users &&
             gunicorn authconfig.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -'
    restart: unless-stopped

  main:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      content_db:
        condition: service_healthy
      auth:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-django-secret}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,main
      DB_HOST: content_db
      DB_NAME: content
      DB_USER: content
      DJANGO_DEBUG: 1
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:-local-content-password}
      WP_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      AUTH_INTROSPECT_KEY: ${AUTH_INTROSPECT_KEY:-local-service-key-at-least-32-characters-long}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      AUTH_INTROSPECT_URL: http://auth:8000/api/tokens/introspect/
    command: >-
      sh -c 'python manage.py migrate --noinput &&
             python manage.py migrate_wp &&
             gunicorn siteconfig.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      main:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DJANGO_API_INTERNAL_URL: http://main:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${WORDPRESS_DB_USER:-wp}
      PMA_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      UPLOAD_LIMIT: 256M

volumes:
  db_data:
  content_data:
  auth_data:
  wp_files:
